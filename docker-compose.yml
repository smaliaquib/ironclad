services:
  agent:
    build:
      context: ../agent
    ports:
      - "8000:8000"
    env_file:
      - ../agent/.env

  router:
    build:
      context: ../router
    ports:
      - "8080:8080"
    environment:
      AGENT_URL: http://agent:8000
    depends_on:
      - agent

  frontend:
    build:
      context: ../frontend
      args:
        VITE_ROUTER_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - router
