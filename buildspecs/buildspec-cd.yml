version: 0.2

# CD - build, tag, push to ECR, force ECS redeployment
# Triggered on: merges to the frontend branch
#
# Required environment variables (injected by the CodeBuild project):
#   ECR_REPO_URL       - full ECR repo URI (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/ironclad-dev-frontend)
#   AWS_DEFAULT_REGION - target region
#   AWS_ACCOUNT_ID     - AWS account ID
#   ECS_CLUSTER        - ECS cluster name
#   ECS_SERVICE        - ECS service name
#   ROUTER_URL         - router's base URL, baked in as VITE_ROUTER_URL at build time (Vite env vars are compile-time)

env:
  variables:
    # Default for local/manual builds - overridden by the CodeBuild project's env vars
    AWS_DEFAULT_REGION: "us-east-1"

phases:
  pre_build:
    commands:
      - echo "=== Authenticating to ECR ==="
      - ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - COMMIT_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo "Image will be tagged as :latest and :$COMMIT_TAG"
      - echo "=== Setting up docker buildx ==="
      - docker buildx create --use --name multiarch-builder || docker buildx use multiarch-builder
      - docker buildx inspect --bootstrap

  build:
    commands:
      - echo "=== Building and pushing Docker image ==="
      - |
        docker buildx build \
          --platform linux/amd64 \
          --build-arg VITE_ROUTER_URL=http://$ROUTER_URL \
          -t $ECR_REPO_URL:latest \
          -t $ECR_REPO_URL:$COMMIT_TAG \
          --push \
          --no-cache \
          .

  post_build:
    commands:
      - echo "=== Forcing ECS redeployment ==="
      - |
        aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --force-new-deployment \
          --region $AWS_DEFAULT_REGION
      - echo "=== Deployment triggered for $ECS_CLUSTER / $ECS_SERVICE ==="
      - echo "Image pushed -> $ECR_REPO_URL:latest ($ECR_REPO_URL:$COMMIT_TAG)"
