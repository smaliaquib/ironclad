version: 0.2

# CI - lint, format-check, unit tests, schema-drift check
# Triggered on: pull requests and feature branch pushes

env:
  variables:
    PYTHON_VERSION: "3.12"

phases:
  install:
    runtime-versions:
      python: "3.12"
    commands:
      - echo "=== Installing uv ==="
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - uv --version

  pre_build:
    commands:
      - echo "=== Syncing dependencies (incl. dev group) ==="
      - export PATH="$HOME/.local/bin:$PATH"
      - uv sync --frozen

  build:
    commands:
      - export PATH="$HOME/.local/bin:$PATH"
      - echo "=== Lint (ruff) ==="
      - uv run ruff check .
      - echo "=== Format check (black) ==="
      - uv run black --check .
      - echo "=== Schema drift check ==="
      - cp schemas.generated.json /tmp/schemas.committed.json
      - uv run python generate_schemas.py
      - |
        if ! diff -q schemas.generated.json /tmp/schemas.committed.json > /dev/null; then
          echo "schemas.generated.json is stale - a tool's Pydantic model changed without regenerating it."
          echo "Run: uv run python generate_schemas.py, then commit the result."
          diff schemas.generated.json /tmp/schemas.committed.json || true
          exit 1
        fi

  post_build:
    commands:
      - export PATH="$HOME/.local/bin:$PATH"
      - echo "=== Unit tests ==="
      - uv run pytest tests/unit/ -v --tb=short --junitxml=test-results.xml

reports:
  pytest-results:
    files:
      - "test-results.xml"
    discard-paths: yes
    file-format: JUNITXML
