[project]
name = "mcp-tools"
version = "0.1.0"
description = "Lambda-backed MCP tools for the Ironclad mcp-gateway"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.40",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
