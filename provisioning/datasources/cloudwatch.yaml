apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    access: proxy
    isDefault: true
    jsonData:
      # authType: default means the AWS SDK's default credential chain -
      # i.e. this ECS task's own IAM role. No access keys are ever stored
      # here, in an env var, or anywhere else.
      authType: default
      defaultRegion: ${AWS_REGION}
