apiVersion: 1

datasources:
  - name: CloudWatch
    # Fixed, human-readable uid (not Grafana's auto-generated random hash) -
    # there's no persistent volume here, so a fresh container restart
    # re-runs this provisioning from scratch. Every dashboard JSON in this
    # repo references this exact uid; without pinning it, a restart could
    # silently break every panel's datasource reference.
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    isDefault: true
    jsonData:
      # authType: default means the AWS SDK's default credential chain -
      # i.e. this ECS task's own IAM role. No access keys are ever stored
      # here, in an env var, or anywhere else.
      authType: default
      defaultRegion: ${AWS_REGION}
